name: Record TVL history

on:
  schedule:
    - cron: "40 23 * * *"      # every day at 23:40 UTC (03:10 next morning in Tehran)
  workflow_dispatch:            # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: record-tvl-history
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas requests curl_cffi

      - name: Record today's TVL and FDV
        run: python scripts/record_tvl_snapshot.py

      - name: Commit the updated history file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/axelar_tvl_history.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Record TVL snapshot $(date -u +%F)"
            git pull --rebase
            git push
          fi
