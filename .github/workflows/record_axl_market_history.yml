name: Record AXL market history

on:
  schedule:
    - cron: "50 23 * * *"     # every day at 23:50 UTC (the snapshot is stored under that UTC day)
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: record-axl-market-history
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy requests curl_cffi

      - name: Record today's AXL market snapshot
        run: python scripts/record_axl_market_snapshot.py

      - name: Commit the updated history files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/axl_market_history.csv data/axl_market_detail_history.csv data/axl_market_latest.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Record AXL market snapshot $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
